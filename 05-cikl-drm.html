<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цикл DRM</title>
<style>html,body{margin:0;padding:0;width:100%;background:#030407;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}.wrap{padding:74px 6vw;max-width:1280px;margin:0 auto;box-sizing:border-box}.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7FB4FF;margin:0 0 14px}.title{font-size:clamp(26px,3.4vw,46px);font-weight:200;letter-spacing:-.01em;color:#F2F5FA;margin:0 0 34px;max-width:17em;line-height:1.1}.lead{font-size:clamp(15px,1.5vw,20px);font-weight:300;line-height:1.7;color:rgba(220,228,240,.68);max-width:38em;margin:0}.glass{border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-sizing:border-box}.media-window{border-radius:20px;min-height:210px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box}.mw-ico{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.20);display:flex;align-items:center;justify-content:center;color:rgba(220,228,240,.55)}.mw-ico svg{width:20px;height:20px}.mw-label{font-size:11px;letter-spacing:.06em;color:rgba(200,210,225,.42)}.zz-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch;margin-bottom:20px}@media(max-width:760px){.zz-row{grid-template-columns:1fr}.zz-row .mobile-first{order:-1}.media-window{min-height:170px}}.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.chip{padding:22px 18px;display:flex;flex-direction:column;gap:10px}.chip .ci{width:38px;height:38px;border-radius:11px;background:rgba(127,180,255,.12);border:1px solid rgba(127,180,255,.22);display:flex;align-items:center;justify-content:center;color:#9CC4FF}.chip .ct{font-size:14px;font-weight:500;color:#EEF2F8;margin:0}.chip .cd{font-size:12px;line-height:1.5;color:rgba(200,212,230,.55);margin:0}</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Управление рисками</p>
<h2 class="title">Полный цикл — до, во время и после удара.</h2>
<div class="cycle">
<div class="glass chip"><span class="ci"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></span><p class="ct">Митигация</p><p class="cd">Снижаем риск заранее</p></div>
<div class="glass chip"><span class="ci"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><p class="ct">Подготовка</p><p class="cd">Планы и обучение команд</p></div>
<div class="glass chip"><span class="ci"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v6l4-2M5 12a7 7 0 1 0 7-7"/></svg></span><p class="ct">Реагирование</p><p class="cd">Поддержка на месте</p></div>
<div class="glass chip"><span class="ci"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4l8 4-8 4-8-4z"/><path d="M6 10v5c0 1 3 2 6 2s6-1 6-2v-5"/></svg></span><p class="ct">Восстановление</p><p class="cd">Быстрый возврат к норме</p></div>
</div>
</div>
</body>
</html>
