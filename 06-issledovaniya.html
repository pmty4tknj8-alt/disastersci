<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Исследования</title>
<style>html,body{margin:0;padding:0;width:100%;background:#030407;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}.wrap{padding:74px 6vw;max-width:1280px;margin:0 auto;box-sizing:border-box}.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7FB4FF;margin:0 0 14px}.title{font-size:clamp(26px,3.4vw,46px);font-weight:200;letter-spacing:-.01em;color:#F2F5FA;margin:0 0 34px;max-width:17em;line-height:1.1}.lead{font-size:clamp(15px,1.5vw,20px);font-weight:300;line-height:1.7;color:rgba(220,228,240,.68);max-width:38em;margin:0}.glass{border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-sizing:border-box}.media-window{border-radius:20px;min-height:210px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box}.mw-ico{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.20);display:flex;align-items:center;justify-content:center;color:rgba(220,228,240,.55)}.mw-ico svg{width:20px;height:20px}.mw-label{font-size:11px;letter-spacing:.06em;color:rgba(200,210,225,.42)}.zz-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch;margin-bottom:20px}@media(max-width:760px){.zz-row{grid-template-columns:1fr}.zz-row .mobile-first{order:-1}.media-window{min-height:170px}}</style>
</head>
<body>
<div class="wrap">
<div class="zz-row" style="margin-bottom:0;">
<div style="padding:8px 4px;display:flex;flex-direction:column;justify-content:center;">
<p class="eyebrow">Исследования</p>
<p style="font-size:clamp(20px,2.2vw,30px);font-weight:400;color:#EEF2F8;margin:0 0 16px;line-height:1.2;">Наука, проверенная практикой.</p>
<p style="font-size:14px;line-height:1.7;font-weight:300;color:rgba(210,220,234,.66);margin:0;">Сотрудничаем с университетами, нацлабораториями и НКО: пилотируем природные модели и измеряем их эффект в снижении рисков — мост между наукой и практикой устойчивости.</p>
</div>
<div class="media-window"><span class="mw-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5h14v14H5z"/><path d="M5 15l4-4 3 3 3-3 4 4"/><circle cx="9" cy="9" r="1.4"/></svg></span><span class="mw-label">Логотипы партнёров</span></div>
</div>
</div>
</body>
</html>
